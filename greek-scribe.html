<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>ΓΡΑΦΕΥΣ — Greek Scribe</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #2a1f15;
      --bg-deep: #1a120a;
      --parchment: #efdfb4;
      --parchment-shadow: #c7b481;
      --ink: #4a2e15;
      --ink-light: #7a5230;
      --gold: #d9b04a;
      --quill-bg: #3d2818;
      --quill-edge: #5c3d24;
      --highlight: #f5e8c2;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, var(--bg) 0%, var(--bg-deep) 100%);
      font-family: 'Gentium Plus', 'Gentium Book Basic', 'Cardo', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
      color: var(--parchment);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      gap: 1rem;
      min-height: 100vh;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .ui {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .title {
      font-size: 1.7rem;
      letter-spacing: 0.2em;
      color: var(--gold);
    }
    .counters {
      display: flex;
      gap: 0.8rem;
      font-size: 1rem;
    }
    .counter {
      background: rgba(0,0,0,0.35);
      padding: 0.35rem 0.8rem;
      border-radius: 0.4rem;
    }
    .counter-value {
      color: var(--gold);
      font-weight: bold;
      margin-left: 0.3rem;
    }

    .scroll {
      width: 100%;
      max-width: 800px;
      flex: 1 1 auto;
      min-height: 60vh;
      background:
        linear-gradient(180deg, var(--parchment) 0%, #e6d29a 100%);
      color: var(--ink);
      border-radius: 0.5rem;
      padding: 2rem 2.4rem;
      box-shadow:
        inset 0 0 3rem rgba(140, 100, 50, 0.2),
        0 1.2rem 2.5rem rgba(0,0,0,0.55);
      font-size: 1.7rem;
      line-height: 1.9;
      letter-spacing: 0.02em;
      overflow-y: auto;
      position: relative;
    }
    .scroll::before, .scroll::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 0.6rem;
      background: linear-gradient(180deg, var(--parchment-shadow), transparent);
      pointer-events: none;
    }
    .scroll::before { top: 0; }
    .scroll::after  { bottom: 0; transform: scaleY(-1); }

    .word {
      display: inline-block;
      margin-right: 0.6rem;
      padding: 0.05rem 0.15rem;
      border-radius: 0.2rem;
      transition: background 200ms;
    }
    .word.completed:hover { background: rgba(120, 80, 40, 0.12); cursor: help; }
    .word .meaning {
      margin-left: 0.4rem;
      font-size: 1.6rem;
      vertical-align: middle;
      opacity: 0;
      transform: scale(0.4);
      display: inline-block;
      transition: opacity 350ms ease-out, transform 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', 'Gentium Plus', 'Cardo', Georgia, serif;
    }
    /* Slightly smaller + italic when the meaning is plain text rather than emoji */
    .word .meaning.text { font-size: 1.15rem; font-style: italic; }
    .word .meaning.show { opacity: 1; transform: scale(1); }
    .word.current { color: var(--ink); }
    .word.current::after {
      content: '';
      display: inline-block;
      width: 0.5em;
      height: 1.2em;
      vertical-align: text-bottom;
      background: var(--ink);
      margin-left: 0.05em;
      animation: blink 1s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .quill-area {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }
    .timer-bar {
      width: 100%;
      max-width: 320px;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 200ms;
    }
    .timer-bar.show { opacity: 1; }
    .timer-fill {
      height: 100%;
      width: 100%;
      background: var(--gold);
      transform-origin: left;
    }

    .quill {
      width: 7rem;
      height: 7rem;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, var(--quill-edge), var(--quill-bg) 70%);
      color: var(--parchment);
      border: 3px solid var(--gold);
      font-family: inherit;
      font-size: 3.4rem;
      cursor: pointer;
      box-shadow:
        0 0.6rem 1.2rem rgba(0,0,0,0.55),
        inset 0 -0.3rem 0.8rem rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 80ms ease, box-shadow 200ms, opacity 200ms;
      -webkit-user-select: none;
      user-select: none;
    }
    .quill:active { transform: scale(0.94); }
    .quill:disabled { opacity: 0.4; cursor: default; }
    .quill:disabled:active { transform: none; }

    .hint {
      font-size: 0.85rem;
      opacity: 0.55;
      max-width: 800px;
      text-align: center;
    }

    /* Quiz mode */
    .quiz {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      padding: 1.5rem 1rem;
      width: 100%;
    }
    .quiz-label {
      font-size: 1rem;
      color: var(--ink-light);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .quiz-emoji {
      font-size: 5rem;
      line-height: 1;
      font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', 'Gentium Plus', 'Cardo', Georgia, serif;
      animation: quizPrompt 550ms cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.18));
    }
    /* Smaller text size for prompts that are plain text rather than emoji */
    .quiz-emoji.text { font-size: 2.6rem; font-style: italic; letter-spacing: 0.04em; }
    @keyframes quizPrompt {
      0%   { opacity: 0; transform: scale(0.4); }
      100% { opacity: 1; transform: scale(1); }
    }
    .quiz-progress {
      display: flex;
      gap: 0.45rem;
      justify-content: center;
      min-height: 3.2rem;
      padding: 0.2rem;
    }
    .progress-slot {
      display: inline-block;
      min-width: 1em;
      font-size: 2.4rem;
      text-align: center;
      border-bottom: 2px solid var(--ink);
      color: var(--ink);
      padding: 0 0.1em;
      transition: color 200ms;
    }
    .progress-slot.empty   { color: transparent; }
    .progress-slot.filled  { animation: revealLetter 350ms ease-out; }
    .progress-slot.skipped { color: var(--ink-light); opacity: 0.75; font-style: italic; }
    .quiz-progress.success .progress-slot {
      color: #2d6a3a;
      animation: pulse 0.5s ease-out;
    }

    .quiz-skip {
      align-self: flex-end;
      background: rgba(60, 30, 10, 0.08);
      border: 1px solid var(--ink-light);
      color: var(--ink-light);
      padding: 0.3rem 0.7rem;
      border-radius: 0.35rem;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 200ms, color 200ms;
      margin-bottom: -0.5rem;
    }
    .quiz-skip:hover { background: rgba(60, 30, 10, 0.2); color: var(--ink); }
    .quiz {
      position: relative;
    }

    .sentence {
      display: block;
      margin-bottom: 0.65rem;
    }
    .sentence:last-child { margin-bottom: 0; }

    /* Hangman / ΑΙΝΙΓΜΑ mode */
    .hangman-lives {
      font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
      font-size: 1.7rem;
      letter-spacing: 0.15rem;
      margin: 0.4rem 0 0.6rem;
    }
    .hangman-lives .life {
      display: inline-block;
      transition: transform 280ms, opacity 280ms;
    }
    .hangman-lives .life.lost {
      opacity: 0.5;
      transform: scale(0.85) rotate(-8deg);
    }

    .hangman-sentence {
      font-size: 1.55rem;
      line-height: 2.3;
      text-align: center;
      max-width: 100%;
      margin: 0.6rem 0 0.8rem;
      color: var(--ink);
    }
    .hg-word {
      display: inline-block;
      margin: 0.2rem 0.55rem;
      position: relative;
      padding-top: 1.5rem;
      vertical-align: top;
    }
    .hg-word .hg-emoji {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.25rem;
      font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', 'Gentium Plus', 'Cardo', Georgia, serif;
      white-space: nowrap;
    }
    .hg-word .hg-emoji.text { font-size: 0.85rem; font-style: italic; }
    .hg-char {
      display: inline-block;
      min-width: 0.75em;
      text-align: center;
      border-bottom: 2px solid var(--ink);
      margin: 0 0.04em;
      color: var(--ink);
    }
    .hg-char.hidden    { color: transparent; }
    .hg-char.skipped   { color: var(--ink-light); opacity: 0.75; font-style: italic; }
    .hg-char.revealed  { animation: revealLetter 360ms ease-out; }
    @keyframes revealLetter {
      0%   { transform: scale(1.55) translateY(-2px); color: #6a4a18; }
      100% { transform: scale(1)    translateY(0);    color: var(--ink); }
    }

    .hangman-keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 0.32rem;
      justify-content: center;
      max-width: 580px;
      margin-top: 0.4rem;
    }
    .hg-key {
      background: rgba(60, 30, 10, 0.07);
      border: 2px solid var(--ink);
      color: var(--ink);
      padding: 0.4rem 0.7rem;
      border-radius: 0.4rem;
      font-family: inherit;
      font-size: 1.15rem;
      cursor: pointer;
      min-width: 2.1rem;
      transition: background 180ms, opacity 220ms, transform 80ms;
      -webkit-tap-highlight-color: transparent;
    }
    .hg-key:hover:not(:disabled) { background: rgba(60, 30, 10, 0.18); }
    .hg-key:active:not(:disabled) { transform: scale(0.93); }
    .hg-key.used { cursor: default; }
    .hg-key.miss { background: rgba(180, 60, 40, 0.22); opacity: 0.5; }
    .hg-key.hit  { background: rgba(60, 130, 60, 0.18); border-color: #2d6a3a; opacity: 0.7; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.15); }
    }
    .quiz-letters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      justify-content: center;
      max-width: 560px;
    }
    .quiz-letter {
      background: rgba(60, 30, 10, 0.06);
      border: 2px solid var(--ink);
      color: var(--ink);
      padding: 0.45rem 0.85rem;
      border-radius: 0.45rem;
      font-family: inherit;
      font-size: 1.6rem;
      cursor: pointer;
      min-width: 2.6rem;
      transition: transform 80ms, background 200ms, opacity 250ms;
      -webkit-tap-highlight-color: transparent;
    }
    .quiz-letter:hover:not(:disabled) { background: rgba(60, 30, 10, 0.16); }
    .quiz-letter:active:not(:disabled) { transform: scale(0.92); }
    .quiz-letter.used { opacity: 0.25; cursor: default; }
    .quiz-letter.shaking {
      animation: quizShake 0.4s ease-in-out;
      background: rgba(180, 60, 40, 0.18);
    }
    @keyframes quizShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    .home-link {
      font-size: 0.85rem;
      font-family: inherit;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 0.08em;
      opacity: 0.65;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .home-link:hover { opacity: 1; }

    .word-tooltip {
      position: fixed;
      top: 0;
      left: 0;
      background: rgba(35, 22, 8, 0.96);
      color: var(--parchment);
      padding: 0.35rem 0.75rem;
      border-radius: 0.4rem;
      font-size: 0.95rem;
      pointer-events: none;
      z-index: 250;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, -110%);
      transition: opacity 150ms ease-out;
      border: 1px solid var(--gold);
      box-shadow: 0 0.3rem 0.7rem rgba(0,0,0,0.55);
      font-family: 'Gentium Plus', 'Cardo', 'Palatino Linotype', Georgia, serif;
    }
    .word-tooltip.show { opacity: 1; }

    /* Welcome screen */
    .welcome-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 14, 8, 0.93);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 1rem;
    }
    .welcome-overlay.hidden { display: none; }
    .welcome-box {
      background: linear-gradient(180deg, var(--parchment), #e6d29a);
      color: var(--ink);
      border-radius: 0.8rem;
      padding: 2rem 1.8rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 1.5rem 3rem rgba(0,0,0,0.6);
      border: 2px solid var(--gold);
    }
    .welcome-title {
      font-size: 2.2rem;
      letter-spacing: 0.2em;
      color: var(--quill-bg);
      margin: 0 0 0.6rem;
    }
    .welcome-text { font-size: 1.05rem; margin: 0.3rem 0; }
    .welcome-sub  { font-size: 0.85rem; opacity: 0.7; margin: 0.5rem 0 1.4rem; }
    .welcome-choices { display: flex; flex-direction: column; gap: 0.8rem; }
    .welcome-btn {
      background: var(--quill-bg);
      color: var(--parchment);
      border: 2px solid var(--gold);
      border-radius: 0.5rem;
      padding: 0.9rem 1rem;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      transition: transform 80ms ease, background 200ms;
    }
    .welcome-btn:hover  { background: var(--quill-edge); transform: translateY(-2px); }
    .welcome-btn:active { transform: scale(0.98); }
    .welcome-btn-title  { font-size: 1.5rem; letter-spacing: 0.15em; color: var(--gold); }
    .welcome-btn-desc   { font-size: 0.85rem; opacity: 0.85; }

    /* Settings */
    .settings-btn {
      background: rgba(0,0,0,0.35);
      border: none;
      color: var(--gold);
      font-size: 1.1rem;
      padding: 0.35rem 0.6rem;
      border-radius: 0.4rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 200ms;
    }
    .settings-btn:hover { background: rgba(0,0,0,0.55); }

    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 14, 8, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 400;
      padding: 1rem;
    }
    .settings-overlay.hidden { display: none; }
    .settings-box {
      background: linear-gradient(180deg, var(--parchment), #e6d29a);
      color: var(--ink);
      border-radius: 0.8rem;
      padding: 1.6rem;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 1.5rem 3rem rgba(0,0,0,0.6);
      border: 2px solid var(--gold);
      max-height: 90vh;
      overflow-y: auto;
    }
    .settings-title {
      margin: 0 0 1rem;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      color: var(--quill-bg);
      text-align: center;
    }
    .settings-packs { display: flex; flex-direction: column; gap: 0.7rem; }
    .settings-divider { border: none; border-top: 1px solid rgba(74,46,21,0.25); margin: 1rem 0; }
    .settings-pack {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      padding: 0.7rem;
      background: rgba(120, 80, 40, 0.12);
      border-radius: 0.5rem;
      cursor: pointer;
    }
    .settings-pack input { margin-top: 0.2rem; transform: scale(1.3); cursor: pointer; }
    .settings-pack-info { display: flex; flex-direction: column; gap: 0.15rem; }
    .settings-pack-name { font-weight: bold; font-size: 1.05rem; }
    .settings-pack-desc { font-size: 0.82rem; opacity: 0.75; }
    .settings-actions {
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      margin-top: 1.3rem;
    }
    .settings-actions button {
      flex: 1;
      padding: 0.6rem;
      border-radius: 0.45rem;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 80ms ease;
    }
    .settings-actions button:active { transform: scale(0.97); }
    .settings-reset {
      background: transparent;
      color: var(--ink);
      border: 2px solid var(--ink-light);
    }
    .settings-close {
      background: var(--quill-bg);
      color: var(--parchment);
      border: 2px solid var(--gold);
    }
  </style>
</head>
<body>

  <div class="welcome-overlay" id="welcome-overlay">
    <div class="welcome-box">
      <h1 class="welcome-title">ΓΡΑΦΕΥΣ</h1>
      <p class="welcome-text">Read and spell Greek, one sentence at a time.</p>
      <p class="welcome-sub">Pick a starting style — you can change content packs anytime with the ⚙ settings button.</p>
      <div class="welcome-choices">
        <button class="welcome-btn" data-dialect="attic" type="button">
          <span class="welcome-btn-title">ΑΤΤΙΚΗ</span>
          <span class="welcome-btn-desc">Classical Attic — everyday words &amp; the Greek gods</span>
        </button>
        <button class="welcome-btn" data-dialect="koine" type="button">
          <span class="welcome-btn-title">ΚΟΙΝΗ</span>
          <span class="welcome-btn-desc">Koine — New Testament / biblical Greek</span>
        </button>
      </div>
    </div>
  </div>

  <div class="ui">
    <a class="home-link" href="index.html">&#8592; Home</a>
    <div class="title">ΓΡΑΦΕΥΣ</div>
    <div class="counters">
      <div class="counter">γράμματα <span class="counter-value" id="letters">0</span></div>
      <div class="counter">λέξεις   <span class="counter-value" id="words">0</span></div>
      <div class="counter">✓ <span class="counter-value" id="passed">0</span></div>
      <button class="settings-btn" id="settings-btn" type="button" aria-label="settings">⚙</button>
    </div>
  </div>

  <div class="settings-overlay hidden" id="settings-overlay">
    <div class="settings-box">
      <h2 class="settings-title">Content Packs</h2>
      <div class="settings-packs" id="settings-packs"></div>
      <hr class="settings-divider" />
      <label class="settings-pack">
        <input type="checkbox" id="quiz-only-toggle">
        <div class="settings-pack-info">
          <span class="settings-pack-name">Quiz-only mode</span>
          <span class="settings-pack-desc">Skip writing — just spelling quizzes &amp; ΑΙΝΙΓΜΑ, drawn at random from your packs</span>
        </div>
      </label>
      <div class="settings-actions">
        <button class="settings-reset" id="settings-reset" type="button">Start over</button>
        <button class="settings-close" id="settings-close" type="button">Done</button>
      </div>
    </div>
  </div>

  <div class="word-tooltip" id="word-tooltip"></div>

  <div class="scroll" id="scroll"><div class="sentences" id="sentences"></div></div>

  <div class="quill-area" id="quill-area">
    <div class="timer-bar" id="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
    <button class="quill" id="quill" aria-label="write next letter">
      <span id="next-letter">·</span>
    </button>
  </div>

  <div class="hint" id="hint">Click the quill to write the next letter · Hover a finished word for its meaning</div>

  <script>
    (function () {
      const PACKS = {
        'logos-basics': {
          name: 'Λόγος αʹ — Βασικά',
          description: 'Basic vocabulary: people, animals, household items, nature',
          dialect: 'attic',
          words: {
            // function / abstract
            'ἐστιν':    { en: 'is',                      emoji: null },
            'ἐστι':     { en: 'is',                      emoji: null },
            'οὐκ':      { en: 'not',                     emoji: '🚫' },
            // adjectives (gender-agreeing forms)
            'καλός':    { en: 'good, beautiful (m.)',    emoji: '👍', noQuiz: true },
            'καλή':     { en: 'good, beautiful (f.)',    emoji: '👍', noQuiz: true },
            'καλόν':    { en: 'good, beautiful (n.)',    emoji: '👍', noQuiz: true },
            'κακός':    { en: 'bad (m.)',                emoji: '👎', noQuiz: true },
            'κακή':     { en: 'bad (f.)',                emoji: '👎', noQuiz: true },
            'κακόν':    { en: 'bad (n.)',                emoji: '👎', noQuiz: true },
            // nouns — people
            'ἄνθρωπος': { en: 'person, human',           emoji: '🧑' },
            'ἀνήρ':     { en: 'man',                     emoji: '👨' },
            'γυνή':     { en: 'woman',                   emoji: '👩' },
            'γέρων':    { en: 'old man',                 emoji: '👴' },
            'παιδίον':  { en: 'little child',            emoji: '👶' },
            // nouns — places and things
            'οἷκος':    { en: 'family, household',       emoji: '👨👩👶' },
            'οἰκία':    { en: 'house',                   emoji: '🏠' },
            'ναός':     { en: 'temple',                  emoji: '🏛️' },
            'νῆσος':    { en: 'island',                  emoji: '🏝️' },
            'ὁδός':     { en: 'road, path, way',         emoji: '👣🛤️' },

          sentences: [

            'ὁ ἀδελφὸς ἐν Χριστῷ',
            'ὁ κύριος ἐν οὐρανῷ',
            'ἀκούω τὸν λόγον',
            'πιστεύω εἰς Χριστόν',
            'ἔχω ζωήν',

            'ἐγὼ ἀκούω καὶ ὁ ἀδελφὸς ἀκούει',
            'οὐκ ἀκούω'

      };

      // Active pack ids — for Step 1 all packs are active. Step 3 will hook this up to user choice.
      let activePackIds = ['logos-basics', 'greek-gods', 'koine-foundations'];

      let WORDS = {};
      let SENTENCES = [];

      function rebuildPool() {
        WORDS = {};
        SENTENCES = [];
        activePackIds.forEach(id => {
          const pack = PACKS[id];
          if (!pack) return;
          Object.assign(WORDS, pack.words);
          SENTENCES.push(...pack.sentences);
        });
      }
      rebuildPool();

      // Set which packs are active, rebuild the pool, and reset the sentence queue
      // so the next sentence is drawn from the new selection.
      function setActivePacks(ids) {
        const valid = ids.filter(id => PACKS[id]);
        activePackIds = valid.length ? valid : ['logos-basics'];
        rebuildPool();
        sentenceQueue = [];
      }

      // Console testing hook (until the settings UI lands in Step 3/4):
      //   scribeSetPacks(['koine-foundations'])      → Koine only
      //   scribeSetPacks(['logos-basics','greek-gods']) → Attic only
      //   scribeListPacks()                          → see available pack ids
      window.scribeSetPacks  = (ids) => { setActivePacks(ids); return activePackIds; };
      window.scribeListPacks = () => Object.keys(PACKS).map(id =>
        ({ id, name: PACKS[id].name, sentences: PACKS[id].sentences.length }));

      const EASY_QUIZ_THRESHOLD = 5;   // quiz every sentence for first N
      const PAIR_QUIZ_SECOND_CHANCE = 0.5;  // after threshold, chance to pick word from earlier sentence
      const HANGMAN_EVERY  = 4;        // every Nth quiz is a hangman
      const HANGMAN_LIVES  = 6;
      const GREEK_ALPHABET = ['α','β','γ','δ','ε','ζ','η','θ','ι','κ','λ','μ','ν','ξ','ο','π','ρ','σ','τ','υ','φ','χ','ψ','ω'];

      const GREEK_LETTERS = ['α','β','γ','δ','ε','ζ','η','θ','ι','κ','λ','μ','ν','ξ','ο','π','ρ','σ','τ','υ','φ','χ','ψ','ω'];

      const scroll        = document.getElementById('scroll');
      const sentencesEl   = document.getElementById('sentences');
      const nextLetterEl  = document.getElementById('next-letter');
      const quill         = document.getElementById('quill');
      const quillArea     = document.getElementById('quill-area');
      const lettersEl     = document.getElementById('letters');
      const wordsEl       = document.getElementById('words');
      const passedEl      = document.getElementById('passed');
      const timerBar      = document.getElementById('timer-bar');
      const timerFill     = document.getElementById('timer-fill');
      const hint          = document.getElementById('hint');

      const COMPREHENSION_MS = 5000;
      const SHORT_PAUSE_MS   = 700;
      const MAX_VISIBLE_SENTENCES = 12;   // parchment keeps this many sentences scrollable
      const wordSeenCount = {};           // tracks familiarity → shorter timer for common words

      let currentSentenceWords  = [];
      let currentWordIndex      = 0;
      let currentWordStr        = '';
      let currentWordInfo       = null;
      let letterIndex           = 0;
      let currentWordEl         = null;
      let currentSentenceBlock  = null;
      let sentenceQueue         = [];
      let lettersCount          = 0;
      let wordsCount            = 0;
      let sentencesDone         = 0;
      let previousSentenceWords = null;
      let inQuiz                = false;
      let quizTarget            = '';
      let quizProgress          = '';
      let quizPassed            = 0;
      let quizAttempts          = 0;
      let quizOnlyMode          = false;
      let currentDialect        = 'attic';
      let completedSentences    = [];
      let hangmanLives          = HANGMAN_LIVES;
      let hangmanSentence       = '';

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function isTextLabel(s) { return typeof s === 'string' && /^[a-zA-Z]/.test(s); }
      function isQuizzable(w) { return WORDS[w] && WORDS[w].emoji && !WORDS[w].noQuiz; }
      function clearQuizUI() { scroll.querySelectorAll('.quiz').forEach(el => el.remove()); }
      function showSentences() { sentencesEl.style.display = ''; scroll.scrollTop = scroll.scrollHeight; }
      function hideSentences() { sentencesEl.style.display = 'none'; }

      function startNextSentence() {
        if (sentenceQueue.length === 0) sentenceQueue = shuffle(SENTENCES);
        const sentence = sentenceQueue.shift();
        currentSentenceWords = sentence.split(' ');
        currentWordIndex = 0;

        currentSentenceBlock = document.createElement('div');
        currentSentenceBlock.className = 'sentence';
        sentencesEl.appendChild(currentSentenceBlock);
        while (sentencesEl.children.length > MAX_VISIBLE_SENTENCES) {
          sentencesEl.removeChild(sentencesEl.firstChild);
        }
        scroll.scrollTop = scroll.scrollHeight;
        startNextWord();
      }

      function startNextWord() {
        if (currentWordIndex >= currentSentenceWords.length) {
          onSentenceComplete();
          return;
        }

        if (currentWordIndex > 0) {
          currentSentenceBlock.appendChild(document.createTextNode(' '));
        }

        currentWordStr = currentSentenceWords[currentWordIndex];
        currentWordInfo = WORDS[currentWordStr] || { en: '', emoji: null };
        letterIndex = 0;

        currentWordEl = document.createElement('span');
        currentWordEl.className = 'word current';
        currentSentenceBlock.appendChild(currentWordEl);

        nextLetterEl.textContent = currentWordStr[0];
        quill.disabled = false;
        scroll.scrollTop = scroll.scrollHeight;
      }

      function stampLetter() {
        if (inQuiz || !currentWordStr || quill.disabled) return;
        const letter = currentWordStr[letterIndex];
        currentWordEl.textContent += letter;
        letterIndex++;
        lettersCount++;
        lettersEl.textContent = lettersCount;
        scroll.scrollTop = scroll.scrollHeight;

        if (letterIndex < currentWordStr.length) {
          nextLetterEl.textContent = currentWordStr[letterIndex];
        } else {
          nextLetterEl.textContent = '·';
          onWordComplete();
        }
      }

      function onWordComplete() {
        wordsCount++;
        wordsEl.textContent = wordsCount;
        currentWordEl.classList.remove('current');
        currentWordEl.classList.add('completed');
        currentWordEl.title = currentWordInfo.en || '';

        const emoji = currentWordInfo.emoji;
        let pauseMs = SHORT_PAUSE_MS;

        if (emoji) {
          // Familiarity: the more often you've seen a word, the shorter its dwell
          wordSeenCount[currentWordStr] = (wordSeenCount[currentWordStr] || 0) + 1;
          const seen = wordSeenCount[currentWordStr];
          let compMs;
          if (seen > 6)      compMs = 1400;   // very familiar (e.g. καλός)
          else if (seen > 3) compMs = 2500;   // getting familiar
          else               compMs = COMPREHENSION_MS;  // still learning

          const meaning = document.createElement('span');
          meaning.className = 'meaning' + (isTextLabel(emoji) ? ' text' : '');
          meaning.textContent = emoji;
          currentWordEl.appendChild(meaning);
          requestAnimationFrame(() => meaning.classList.add('show'));

          pauseMs = compMs;
          timerBar.classList.add('show');
          timerFill.style.transition = 'none';
          timerFill.style.transform = 'scaleX(1)';
          requestAnimationFrame(() => {
            timerFill.style.transition = `transform ${compMs}ms linear`;
            timerFill.style.transform = 'scaleX(0)';
          });
        }

        quill.disabled = true;
        nextLetterEl.textContent = '·';

        setTimeout(() => {
          timerBar.classList.remove('show');
          const meaning = currentWordEl.querySelector('.meaning');
          if (meaning) {
            meaning.classList.remove('show');
            setTimeout(() => meaning.remove(), 300);
          }
          currentWordIndex++;
          startNextWord();
        }, pauseMs);
      }

      function onSentenceComplete() {
        sentencesDone++;
        completedSentences.push(currentSentenceWords.join(' '));
        if (completedSentences.length > 20) completedSentences.shift();

        // Easy mode: quiz every sentence for the first N
        if (sentencesDone <= EASY_QUIZ_THRESHOLD) {
          const candidates = currentSentenceWords.filter(isQuizzable);
          if (candidates.length === 0) {
            previousSentenceWords = currentSentenceWords;
            setTimeout(startNextSentence, 500);
            return;
          }
          quizTarget = pick(candidates);
          setTimeout(() => chooseQuizMode(quizTarget), 600);
          return;
        }

        // Hard mode: quiz every 2 sentences, picking from either
        if (previousSentenceWords === null) {
          // first sentence of the pair — bank it, write another
          previousSentenceWords = currentSentenceWords;
          setTimeout(startNextSentence, 500);
          return;
        }

        // second sentence of the pair — pick a content word from either
        const useEarlier = Math.random() < PAIR_QUIZ_SECOND_CHANCE;
        const pool = useEarlier ? previousSentenceWords : currentSentenceWords;
        const fallback = useEarlier ? currentSentenceWords : previousSentenceWords;
        let candidates = pool.filter(isQuizzable);
        if (candidates.length === 0) candidates = fallback.filter(isQuizzable);
        previousSentenceWords = null;

        if (candidates.length === 0) {
          setTimeout(startNextSentence, 500);
          return;
        }
        quizTarget = pick(candidates);
        setTimeout(() => chooseQuizMode(quizTarget), 600);
      }

      function chooseQuizMode(target) {
        quizAttempts++;
        if (quizAttempts % HANGMAN_EVERY === 0 && completedSentences.length > 0) {
          startHangman();
        } else {
          startQuiz(target);
        }
      }

      // Quiz-only mode: skip scribing, run random quizzes back-to-back
      function startQuizOnly() {
        quizAttempts++;
        if (quizAttempts % HANGMAN_EVERY === 0) {
          startHangman();
          return;
        }
        const candidates = Object.keys(WORDS).filter(isQuizzable);
        if (candidates.length === 0) { startHangman(); return; }
        startQuiz(pick(candidates));
      }

      // Called after any quiz/hangman finishes — routes to the right next step
      function continueAfterQuiz() {
        inQuiz = false;
        clearQuizUI();
        if (quizOnlyMode) {
          hideSentences();
          quillArea.style.display = 'none';
          hint.textContent = 'Quiz-only mode — spell the word, or play ΑΙΝΙΓΜΑ · turn off in ⚙ settings';
          startQuizOnly();
        } else {
          quillArea.style.display = '';
          hint.textContent = 'Click the quill to write the next letter · Hover a finished word for its meaning';
          showSentences();
          startNextSentence();
        }
      }

      // Start the appropriate flow given the current mode (used on load and on mode change)
      function startGameFlow() {
        if (quizOnlyMode) {
          hideSentences();
          quillArea.style.display = 'none';
          hint.textContent = 'Quiz-only mode — spell the word, or play ΑΙΝΙΓΜΑ · turn off in ⚙ settings';
          startQuizOnly();
        } else {
          quillArea.style.display = '';
          hint.textContent = 'Click the quill to write the next letter · Hover a finished word for its meaning';
          showSentences();
          startNextSentence();
        }
      }

      function startQuiz(target) {
        inQuiz = true;
        quizProgress = '';
        const info = WORDS[target];

        hideSentences();
        const quiz = document.createElement('div');
        quiz.className = 'quiz';

        const skipBtn = document.createElement('button');
        skipBtn.className = 'quiz-skip';
        skipBtn.type = 'button';
        skipBtn.textContent = 'skip ⏭';
        skipBtn.addEventListener('click', () => onQuizSkip(target));

        const lbl = document.createElement('div');
        lbl.className = 'quiz-label';
        lbl.textContent = 'spell this word';

        const emojiEl = document.createElement('div');
        emojiEl.className = 'quiz-emoji' + (isTextLabel(info.emoji) ? ' text' : '');
        emojiEl.textContent = info.emoji;

        const progressEl = document.createElement('div');
        progressEl.className = 'quiz-progress';
        progressEl.id = 'quiz-progress';

        const targetLetters = Array.from(target);
        targetLetters.forEach(letter => {
          const slot = document.createElement('span');
          slot.className = 'progress-slot empty';
          slot.dataset.expected = letter;
          slot.textContent = letter;
          progressEl.appendChild(slot);
        });

        const pool = document.createElement('div');
        pool.className = 'quiz-letters';

        const decoys = pickDecoys(targetLetters, 5);
        const allLetters = shuffle([...targetLetters, ...decoys]);

        allLetters.forEach((letter, i) => {
          const btn = document.createElement('button');
          btn.className = 'quiz-letter';
          btn.type = 'button';
          btn.textContent = letter;
          btn.dataset.letter = letter;
          btn.addEventListener('click', () => onQuizLetterClick(btn, letter, target));
          pool.appendChild(btn);
        });

        quiz.append(skipBtn, lbl, emojiEl, progressEl, pool);
        scroll.appendChild(quiz);

        quillArea.style.display = 'none';
        hint.textContent = 'Click letters to spell the word · Wrong letters bounce back · skip if stuck';
      }

      function onQuizSkip(target) {
        const progressEl = document.getElementById('quiz-progress');
        if (progressEl) {
          Array.from(progressEl.children).forEach(slot => {
            slot.classList.remove('empty');
            slot.classList.add('skipped');
          });
        }
        setTimeout(continueAfterQuiz, 1100);
      }

      function pickDecoys(targetLetters, n) {
        const targetBare = new Set(targetLetters.map(stripDiacritics));
        const pool = GREEK_LETTERS.filter(l => !targetBare.has(l));
        return shuffle(pool).slice(0, n);
      }

      function stripDiacritics(s) {
        return s.normalize('NFD')
          .replace(/[̀-ͯ]/g, '')
          .toLowerCase()
          .replace(/ς/g, 'σ');
      }

      function onQuizLetterClick(btn, letter, target) {
        if (btn.disabled) return;
        const expected = Array.from(target)[quizProgress.length];
        if (letter === expected) {
          const progressEl = document.getElementById('quiz-progress');
          const slot = progressEl.children[quizProgress.length];
          if (slot) {
            slot.classList.remove('empty');
            slot.classList.add('filled');
          }
          quizProgress += letter;
          btn.classList.add('used');
          btn.disabled = true;
          if (quizProgress === target) {
            progressEl.classList.add('success');
            onQuizComplete();
          }
        } else {
          btn.classList.remove('shaking');
          void btn.offsetWidth;
          btn.classList.add('shaking');
          setTimeout(() => btn.classList.remove('shaking'), 420);
        }
      }

      function onQuizComplete() {
        quizPassed++;
        passedEl.textContent = quizPassed;
        setTimeout(continueAfterQuiz, 1400);
      }

      // ===== Hangman / ΑΙΝΙΓΜΑ =====

      function startHangman() {
        inQuiz = true;
        hangmanLives = HANGMAN_LIVES;

        // pick a sentence to guess. In normal mode prefer a previously-seen one
        // (not the most recent); in quiz-only mode draw from the whole active pool.
        let pool;
        if (quizOnlyMode || completedSentences.length === 0) {
          pool = SENTENCES;
        } else {
          pool = completedSentences.length > 1 ? completedSentences.slice(0, -1) : completedSentences;
        }
        hangmanSentence = pick(pool);

        hideSentences();

        const quiz = document.createElement('div');
        quiz.className = 'quiz hangman';

        const skipBtn = document.createElement('button');
        skipBtn.className = 'quiz-skip';
        skipBtn.type = 'button';
        skipBtn.textContent = 'skip ⏭';
        skipBtn.addEventListener('click', onHangmanSkip);

        const lbl = document.createElement('div');
        lbl.className = 'quiz-label';
        lbl.textContent = 'ΑΙΝΙΓΜΑ';

        const lives = document.createElement('div');
        lives.className = 'hangman-lives';
        lives.id = 'hangman-lives';
        for (let i = 0; i < HANGMAN_LIVES; i++) {
          const span = document.createElement('span');
          span.className = 'life';
          span.textContent = '🏛️';
          lives.appendChild(span);
        }

        const sent = document.createElement('div');
        sent.className = 'hangman-sentence';
        sent.id = 'hangman-sentence';

        hangmanSentence.split(' ').forEach(word => {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'hg-word';

          const info = WORDS[word];
          if (info && info.emoji) {
            const em = document.createElement('span');
            em.className = 'hg-emoji' + (isTextLabel(info.emoji) ? ' text' : '');
            em.textContent = info.emoji;
            wordSpan.appendChild(em);
          }

          Array.from(word).forEach(letter => {
            const charSpan = document.createElement('span');
            charSpan.className = 'hg-char hidden';
            charSpan.dataset.letter = letter;
            charSpan.textContent = letter;
            wordSpan.appendChild(charSpan);
          });

          sent.appendChild(wordSpan);
        });

        const keyboard = document.createElement('div');
        keyboard.className = 'hangman-keyboard';
        GREEK_ALPHABET.forEach(letter => {
          const btn = document.createElement('button');
          btn.className = 'hg-key';
          btn.type = 'button';
          btn.textContent = letter;
          btn.dataset.letter = letter;
          btn.addEventListener('click', () => onHangmanLetterClick(btn, letter));
          keyboard.appendChild(btn);
        });

        quiz.append(skipBtn, lbl, lives, sent, keyboard);
        scroll.appendChild(quiz);

        quillArea.style.display = 'none';
        hint.textContent = 'ΑΙΝΙΓΜΑ — guess letters · 🏛️ columns are your lives · click skip if stuck';
      }

      function onHangmanLetterClick(btn, letter) {
        if (btn.disabled || btn.classList.contains('used')) return;

        const chars = document.querySelectorAll('#hangman-sentence .hg-char.hidden');
        let matched = 0;
        chars.forEach(charEl => {
          if (stripDiacritics(charEl.dataset.letter) === letter) {
            charEl.classList.remove('hidden');
            charEl.classList.add('revealed');
            matched++;
          }
        });

        btn.classList.add('used');
        if (matched > 0) {
          btn.classList.add('hit');
          const stillHidden = document.querySelectorAll('#hangman-sentence .hg-char.hidden');
          if (stillHidden.length === 0) onHangmanWin();
        } else {
          btn.classList.add('miss');
          hangmanLives--;
          const lives = document.querySelectorAll('#hangman-lives .life');
          if (lives[hangmanLives]) {
            lives[hangmanLives].classList.add('lost');
            lives[hangmanLives].textContent = '🪨';
          }
          if (hangmanLives <= 0) onHangmanLose();
        }
      }

      function exitHangman(delay) {
        document.querySelectorAll('.hg-key').forEach(k => k.disabled = true);
        setTimeout(continueAfterQuiz, delay);
      }

      function onHangmanWin() {
        quizPassed++;
        passedEl.textContent = quizPassed;
        exitHangman(1800);
      }

      function onHangmanLose() {
        document.querySelectorAll('#hangman-sentence .hg-char.hidden').forEach(c => {
          c.classList.remove('hidden');
          c.classList.add('skipped');
        });
        exitHangman(2400);
      }

      function onHangmanSkip() {
        document.querySelectorAll('#hangman-sentence .hg-char.hidden').forEach(c => {
          c.classList.remove('hidden');
          c.classList.add('skipped');
        });
        exitHangman(1200);
      }

      quill.addEventListener('click', stampLetter);

      // Tap/click on completed words shows English meaning (mobile-friendly tooltip)
      const wordTip = document.getElementById('word-tooltip');
      let wordTipTimer = null;
      function showWordTip(wordEl) {
        const en = wordEl.title;
        if (!en) return;
        wordTip.textContent = en;
        const rect = wordEl.getBoundingClientRect();
        wordTip.style.left = (rect.left + rect.width / 2) + 'px';
        wordTip.style.top  = (rect.top - 6) + 'px';
        wordTip.classList.add('show');
        clearTimeout(wordTipTimer);
        wordTipTimer = setTimeout(() => wordTip.classList.remove('show'), 2500);
      }
      scroll.addEventListener('click', (e) => {
        const w = e.target.closest('.word.completed');
        if (w) showWordTip(w);
        else wordTip.classList.remove('show');
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.word.completed')) wordTip.classList.remove('show');
      });

      // --- Welcome screen + config persistence ---
      const STORAGE_KEY = 'greek-scribe.v1.config';
      const welcomeOverlay = document.getElementById('welcome-overlay');

      function loadConfig() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
      }
      function saveConfig(cfg) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); } catch (e) {}
      }
      function persistConfig() {
        saveConfig({ version: 1, dialect: currentDialect, activePacks: activePackIds, quizOnly: quizOnlyMode });
      }
      function applyDialectChoice(dialect) {
        currentDialect = dialect;
        const packs = dialect === 'koine'
          ? ['logos-basics', 'koine-foundations']
          : ['logos-basics', 'greek-gods'];
        setActivePacks(packs);
        persistConfig();
      }

      welcomeOverlay.querySelectorAll('.welcome-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          applyDialectChoice(btn.dataset.dialect);
          welcomeOverlay.classList.add('hidden');
          startGameFlow();
        });
      });

      // --- Settings panel ---
      const settingsBtn     = document.getElementById('settings-btn');
      const settingsOverlay = document.getElementById('settings-overlay');
      const settingsPacks   = document.getElementById('settings-packs');
      const settingsClose   = document.getElementById('settings-close');
      const settingsReset   = document.getElementById('settings-reset');
      const quizOnlyToggle  = document.getElementById('quiz-only-toggle');

      function renderSettingsPacks() {
        settingsPacks.innerHTML = '';
        Object.keys(PACKS).forEach(id => {
          const pack = PACKS[id];
          const label = document.createElement('label');
          label.className = 'settings-pack';

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = activePackIds.includes(id);
          cb.dataset.packId = id;
          cb.addEventListener('change', onPackToggle);

          const info = document.createElement('div');
          info.className = 'settings-pack-info';
          const name = document.createElement('span');
          name.className = 'settings-pack-name';
          name.textContent = pack.name;
          const desc = document.createElement('span');
          desc.className = 'settings-pack-desc';
          desc.textContent = pack.description + ' · ' + pack.sentences.length + ' sentences';
          info.append(name, desc);

          label.append(cb, info);
          settingsPacks.appendChild(label);
        });
      }

      function onPackToggle() {
        const checked = Array.from(settingsPacks.querySelectorAll('input:checked'))
                             .map(cb => cb.dataset.packId);
        setActivePacks(checked);
        // Re-sync the checkboxes in case the "at least one pack" fallback kicked in
        settingsPacks.querySelectorAll('input').forEach(cb => {
          cb.checked = activePackIds.includes(cb.dataset.packId);
        });
        currentDialect = 'custom';
        persistConfig();
      }

      function setQuizOnlyMode(on) {
        quizOnlyMode = on;
        persistConfig();
        if (inQuiz) return;       // a quiz is mid-flight; it'll route correctly when it ends
        startGameFlow();          // not in a quiz — switch flows immediately
      }

      settingsBtn.addEventListener('click', () => {
        renderSettingsPacks();
        quizOnlyToggle.checked = quizOnlyMode;
        settingsOverlay.classList.remove('hidden');
      });
      quizOnlyToggle.addEventListener('change', () => setQuizOnlyMode(quizOnlyToggle.checked));
      settingsClose.addEventListener('click', () => settingsOverlay.classList.add('hidden'));
      settingsOverlay.addEventListener('click', (e) => {
        if (e.target === settingsOverlay) settingsOverlay.classList.add('hidden');
      });
      settingsReset.addEventListener('click', () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        location.reload();
      });

      // On load: restore saved config, or show the welcome screen
      const savedConfig = loadConfig();
      if (savedConfig && Array.isArray(savedConfig.activePacks) && savedConfig.activePacks.length) {
        setActivePacks(savedConfig.activePacks);
        quizOnlyMode = !!savedConfig.quizOnly;
        currentDialect = savedConfig.dialect || 'custom';
        welcomeOverlay.classList.add('hidden');
        startGameFlow();
      } else {
        welcomeOverlay.classList.remove('hidden');
      }
    })();
  </script>

</body>
</html>
