<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Πόλις · Ancient Greek Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  /* parchment + ink */
  --parch:    #ece0c4;
  --parch-2:  #e3d3ad;
  --parch-edge:#d8c49a;
  --ink:      #3a2f24;
  --ink-soft: #6b5a42;
  --ink-line: #4a3c2c;
  --accent:   #6b7d3a; /* olive green */
  --accent-2: #a8702f; /* warm ochre */
  --gold:     #b08d3e;

  /* shared illustration palette */
  --wall:    #e7d6b3;
  --wall-2:  #dcc6a0;
  --roof:    #b25a35;
  --roof-2:  #8a4226;
  --wood:    #8a5a33;
  --sky:     #cfe0e2;
  --stone:   #cabfa3;
  --stone-2: #b6a983;
  --marble:  #efe7d4;
  --marble-2:#e3d8bf;
  --soil:    #b08858;
  --soil-2:  #a87c4e;
  --wheat:   #c8a13a;
  --foliage: #7e9a4e;
  --foliage-2:#9bb56a;
  --olive-leaf:#9aa978;
  --olive-fruit:#4a4030;
  --vine-leaf:#7fa050;
  --grape:   #7d4b86;
  --cloth:   #c06a4a;
  --water:   #8fb4b8;
  --water-2: #bfe0e2;
  --berry:   #b35642;

  /* ground tiles */
  --grass:     #aecb7e;
  --grass-2:   #9dc06c;
  --grass-line:#82a655;
  --plot-line: rgba(74,60,44,0.5);
  --plot-glow: rgba(176,141,62,0.34);
  --road-paved:#d4c6a2;   /* a created road — pale cobbled stone */
}

/* ground tone variants */
#game-root[data-ground="olive"] { --grass:#b7c081; --grass-2:#aab873; --grass-line:#94a05f; }
#game-root[data-ground="sand"]  { --grass:#d8c79a; --grass-2:#cdbb88; --grass-line:#b9a672; }

/* map style variants */
#game-root[data-style="painted"] { --ink-line:rgba(74,60,44,0.0); }
#game-root[data-style="painted"] .map-item .art { filter:drop-shadow(0 5px 4px rgba(58,47,36,0.22)); }
#game-root[data-style="stone"] {
  --wall:#d8ccb2; --wall-2:#cabfa2; --roof:#a9967a; --roof-2:#8f7d63; --wood:#9a8a6f; --sky:#cfc6b0;
  --foliage:#a59d82; --foliage-2:#b6af96; --olive-leaf:#ada58a; --vine-leaf:#a59d82; --grape:#8c8270;
  --cloth:#b3a888; --soil:#b3a888; --soil-2:#a89c7e; --wheat:#9a8e72;
  --marble:#e3dcc9; --marble-2:#d6cdb6; --stone:#cabfa6; --stone-2:#b8ad92;
  --grass:#c7bb9b; --grass-2:#bcae8c; --grass-line:#a89a78;
}
#game-root[data-style="stone"] .art { filter:grayscale(0.5) contrast(0.96); }

* { box-sizing:border-box; }
html, body { margin:0; height:100%; font-family:"Gentium Book Plus",Georgia,serif; color:var(--ink); background:#d7c8a4; overflow:hidden; }

#game-root {
  position:fixed; inset:0;
  color:var(--ink);   /* re-resolve --ink here so dark-mode override reaches inherited text (res numbers, quest, …) */
  background:radial-gradient(120% 100% at 50% -10%, #f3e9d2 0%, var(--parch) 42%, var(--parch-2) 78%, var(--parch-edge) 100%);
  display:flex; flex-direction:column;
}
#game-root::before {
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(84% 66% at 50% 50%, transparent 56%, rgba(90,68,40,0.18) 100%);
  mix-blend-mode:multiply;
}
#game-root::after {
  content:""; position:absolute; inset:0; pointer-events:none; opacity:0.5;
  background-image:repeating-linear-gradient(96deg, rgba(120,95,55,0.035) 0 2px, transparent 2px 7px),
                   repeating-linear-gradient(2deg, rgba(120,95,55,0.03) 0 1px, transparent 1px 9px);
}

.game { position:relative; z-index:1; display:flex; flex-direction:column; height:100%; }
.top { display:flex; align-items:stretch; gap:16px; padding:14px 22px 6px; }
.hud { display:flex; align-items:center; gap:16px; }
.hud-crest { display:flex; flex-direction:column; line-height:1; padding-right:16px; border-right:2px solid rgba(74,60,44,0.18); }
.crest-greek { font-family:"Cinzel",serif; font-weight:700; font-size:24px; letter-spacing:3px; }
.crest-en { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--ink-soft); margin-top:3px; }
.hud-res { display:flex; gap:8px; flex-wrap:wrap; }
.res {
  display:flex; align-items:center; gap:7px;
  background:rgba(255,250,238,0.55);
  border:1.5px solid rgba(74,60,44,0.22);
  border-radius:10px;
  padding:5px 10px 5px 8px;
  box-shadow:0 1px 0 rgba(255,255,255,0.5) inset, 0 2px 5px rgba(90,68,40,0.10);
}
.res-txt { display:flex; flex-direction:column; line-height:1.05; }
.res-num { font-weight:700; font-size:17px; transition:color .2s; }
.res-num.full { color:var(--accent-2); }   /* storeroom full for this resource */
.res.hunger { border-color:#b04a32; background:rgba(176,74,50,0.12); animation:hungerpulse 1.6s ease-in-out infinite; }
.res.hunger .hunger-mark { font-size:18px; color:#b04a32; }
.res.hunger .hunger-greek { color:#b04a32; font-weight:700; }
@keyframes hungerpulse { 0%,100%{ box-shadow:0 0 0 0 rgba(176,74,50,0) } 50%{ box-shadow:0 0 0 3px rgba(176,74,50,0.28) } }
.res-greek { font-size:12px; color:var(--accent); }
.res-en { font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft);
  max-height:0; overflow:hidden; opacity:0; transition:all .2s; }
.res:hover .res-en, .res-en.show { max-height:14px; opacity:1; margin-top:1px; }

.quest {
  flex:1; display:flex; flex-direction:column; justify-content:center;
  background:linear-gradient(180deg, rgba(255,251,240,0.7), rgba(231,214,179,0.55));
  border:1.5px solid rgba(74,60,44,0.25);
  border-radius:13px;
  padding:9px 20px;
  box-shadow:0 2px 6px rgba(90,68,40,0.10), 0 1px 0 rgba(255,255,255,0.5) inset;
}
.quest-step { display:flex; align-items:baseline; gap:12px; }
.q-title-greek { font-family:"Cinzel",serif; font-weight:600; font-size:18px; color:var(--accent-2); letter-spacing:1px; }
.q-title-en { font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-soft); }
.q-count { margin-left:auto; font-size:12px; color:var(--ink-soft); letter-spacing:1px; }
.quest-task { font-size:17px; margin-top:2px; }
.q-word { font-weight:700; font-size:21px; color:var(--accent-2); padding:0 2px; }
.q-hint { font-size:13px; font-style:italic; color:var(--ink-soft); margin-left:4px; }
.quest.done .q-en { color:var(--ink-soft); font-style:italic; }

.stage {
  flex:1; position:relative; display:flex; align-items:center; justify-content:center;
  min-height:0; overflow:hidden; touch-action:none; -ms-touch-action:none;
  cursor:grab;                              /* always grab — we allow drag-slack at any zoom */
  user-select:none; -webkit-user-select:none; -ms-user-select:none;
}
.iso-wrap { position:absolute; top:0; left:0; transform-origin:0 0; }
.stage.panning { cursor:grabbing; }
.iso-canvas { position:relative; }
.ground { display:block; overflow:visible; }
.tile-poly { transition:fill .25s; }
.tile-poly.water { animation:shimmer 5s ease-in-out infinite; }
@keyframes shimmer { 0%,100%{ opacity:1 } 50%{ opacity:.82 } }
.plot { pointer-events:none; }
.plot-target { animation:plotpulse 1.4s ease-in-out infinite; }
@keyframes plotpulse { 0%,100%{ opacity:.5 } 50%{ opacity:1 } }

.map-item { position:absolute; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center; }
.map-item .art {
  display:block; overflow:visible;
  /* one contained "hop" on hover-enter — scale + bottom-anchored origin so
     the house feels like it leans toward you, never floats off its tile. */
  transform-origin:center bottom;
  transition:transform .16s cubic-bezier(.34, 1.4, .64, 1);
}
.map-item:hover .art { transform:scale(1.04); }
.map-item.pulsing { animation:pop .8s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop { 0%{transform:translate(-50%,-100%) scale(.4);opacity:.3} 60%{transform:translate(-50%,-100%) scale(1.08)} 100%{transform:translate(-50%,-100%) scale(1)} }
/* harvest bounce — a quick squash the source gives when you gather from it */
.map-item.harvesting .art { animation:harvestbounce .5s ease-out; }
@keyframes harvestbounce { 0%{transform:scale(1)} 30%{transform:scale(1.14) translateY(-3px)} 60%{transform:scale(.97)} 100%{transform:scale(1)} }
.map-item.ground-plot.harvesting .art { animation:harvestbounceflat .5s ease-out; }
@keyframes harvestbounceflat { 0%{transform:translateY(25px) scale(1)} 30%{transform:translateY(22px) scale(1.1)} 60%{transform:translateY(25px) scale(.98)} 100%{transform:translateY(25px) scale(1)} }
/* ripe field — gentle gold halo signalling "harvest me (type σῖτος)" */
.map-item.ripe .art { animation:ripeglow 1.9s ease-in-out infinite; }
@keyframes ripeglow {
  0%,100% { filter:drop-shadow(0 0 2px rgba(216,178,74,0.5)); }
  50%     { filter:drop-shadow(0 0 7px rgba(216,178,74,0.95)); }
}

/* tile-label: reserve EN's height ALWAYS so the label container never grows
   on hover (avoids the "Greek leaps upward" shake). Only the EN's opacity
   animates; the container stays a fixed size. */
.tile-label { display:flex; flex-direction:column; align-items:center; line-height:1; margin-bottom:2px; pointer-events:none; opacity:0; transition:opacity .14s ease-out; }
.map-item:hover .tile-label { opacity:1; z-index:999; }
.tile-label.persist { opacity:1; }
/* typing highlight: matching labels reveal, grow a touch, matched letters glow */
.tile-label.lit-reveal { opacity:1; z-index:60; }
.tile-label.shown { opacity:1; z-index:60; }   /* tap-revealed (mobile) */
.tile-label.lit-reveal .lbl-greek { transform:scale(1.13); box-shadow:0 2px 8px rgba(90,68,40,0.3); border-color:var(--accent-2); }
.lbl-greek { display:inline-block; font-size:15px; font-weight:700; color:var(--ink); background:rgba(255,250,238,0.85); border:1px solid rgba(74,60,44,0.22); padding:1px 8px; border-radius:9px; box-shadow:0 1px 3px rgba(90,68,40,0.18); white-space:nowrap; transition:transform .12s ease-out; }
.lbl-greek .lit { color:var(--accent-2); }
/* actionable words (things you type to act) gently pulse "type me"; plain names stay flat */
.lbl-greek.actionable { animation:lblpulse 1.7s ease-in-out infinite; }
@keyframes lblpulse { 0%,100% { color:var(--ink); } 50% { color:var(--accent-2); } }
/* object→material recipe stack (πέτρα ↓ ⌖ λίθος) */
.tile-label.recipe { gap:1px; }
.recipe-arrow { font-size:12px; line-height:1; color:var(--ink-soft); margin:0; }
.recipe-harvest { display:inline-flex; align-items:center; gap:3px; }
.recipe-harvest .type-cue { color:var(--accent-2); font-size:13px; }
/* while typing the harvest word, show ONLY it — the object name (πέτρα) and
   the ↓/⌖ appear only on hover/tap. */
.tile-label.recipe.type-yield > .lbl-greek:first-child,
.tile-label.recipe.type-yield > .recipe-arrow,
.tile-label.recipe.type-yield .type-cue { display:none; }
.lbl-en {
  font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft);
  height:15px;            /* fixed — pre-allocate space, no layout shift */
  margin-top:3px;
  opacity:0;
  transition:opacity .14s;
}
.map-item:hover .lbl-en, .lbl-en.show { opacity:1; }
.map-item:hover { z-index:999 !important; }

/* ground plots (fields, vineyard, garden) sit ON their tile rather than
   raised above it. Compose with the hover-scale by re-declaring both. */
.map-item.ground-plot .art { transform:translateY(25px); transform-origin:center; }
.map-item.ground-plot:hover .art { transform:translateY(25px) scale(1.04); }
.map-item.ground-plot .tile-label { transform:translateY(25px); }

.scribe { position:absolute; transform:translate(-50%,-100%); pointer-events:none; }
.citizen { position:absolute; transform:translate(-50%,-100%); pointer-events:none; }
.polites-art { animation:citizenbob 0.9s ease-in-out infinite; }
@keyframes citizenbob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1.5px)} }
.thief { position:absolute; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center; pointer-events:none; }
.thief-art { animation:thiefbob .7s ease-in-out infinite; }
@keyframes thiefbob { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-2px) } }
.thief-name { font-size:14px; font-weight:700; color:#b04a32; background:rgba(255,250,238,0.92); border:1px solid rgba(176,74,50,0.55); border-radius:9px; padding:1px 9px; margin-bottom:3px; white-space:nowrap; box-shadow:0 1px 3px rgba(90,68,40,0.25); transition:all .12s; }
.thief-name.targeting { color:#f7f1e1; background:var(--accent); border-color:var(--accent); box-shadow:0 0 9px rgba(107,125,58,0.65); }

.floater { position:absolute; transform:translate(-50%,-50%); font-weight:700; font-size:18px; color:var(--accent); text-shadow:0 1px 2px rgba(255,250,238,0.9); pointer-events:none; animation:rise 1.4s ease-out forwards; white-space:nowrap; }
@keyframes rise { 0%{opacity:0;transform:translate(-50%,-30%) scale(.7)} 15%{opacity:1} 100%{opacity:0;transform:translate(-50%,-160%) scale(1)} }

.toast { position:absolute; top:18px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; line-height:1.1; background:rgba(255,251,240,0.95); border:1.5px solid rgba(74,60,44,0.3); border-radius:12px; padding:9px 22px; box-shadow:0 6px 18px rgba(90,68,40,0.22); animation:toastin .3s ease-out; z-index:50; }
.toast.good { border-color:var(--accent); } .toast.bad { border-color:#b04a32; }
.toast-greek { font-family:"Cinzel",serif; font-weight:600; font-size:18px; }
.toast.good .toast-greek { color:var(--accent); } .toast.bad .toast-greek { color:#b04a32; }
.toast-en { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); margin-top:2px; }
@keyframes toastin { from{opacity:0;transform:translate(-50%,-8px)} to{opacity:1;transform:translateX(-50%)} }

/* big Greek word flashed in the centre of the scene on each recognised word —
   reinforces the vocabulary you just typed. */
.word-flash {
  position:absolute; left:50%; top:42%; transform:translate(-50%,-50%);
  font-family:"Gentium Book Plus",Georgia,serif;
  font-size:clamp(2.4rem, 9vw, 4.8rem); font-weight:700;
  color:var(--accent-2);
  text-shadow:0 3px 18px rgba(255,250,238,0.95), 0 1px 3px rgba(90,68,40,0.45);
  letter-spacing:0.03em; pointer-events:none; opacity:0; z-index:40; white-space:nowrap;
}
.word-flash.flash { animation:wordFlash 950ms ease-out; }
@keyframes wordFlash {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(.7); }
  18%  { opacity:1; transform:translate(-50%,-50%) scale(1.06); }
  60%  { opacity:1; transform:translate(-50%,-50%) scale(1); }
  100% { opacity:0; transform:translate(-50%,-58%) scale(1); }
}

.typebar-wrap { padding:8px 22px 14px; display:flex; flex-direction:column; gap:9px; }

/* λόγος reference button — replaces always-visible chip tray. Lives where the
   λέξεις toggle used to sit. Tap it (or type `logos`) to open the scroll. */
.logos-bar { display:flex; justify-content:center; gap:10px; }
.logos-btn {
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(255,250,238,0.7);
  border:1.5px solid var(--gold);
  color:var(--ink);
  border-radius:9px;
  padding:5px 14px;
  cursor:pointer;
  font-family:"Cinzel",serif;
  transition:all .14s;
}
.logos-btn:hover { background:#fff8ea; box-shadow:0 4px 10px rgba(176,141,62,0.22); transform:translateY(-1px); }
.logos-btn .lb-icon { font-size:15px; }
.logos-btn .lb-greek { font-size:14px; font-weight:600; letter-spacing:.5px; color:var(--gold); }
.logos-btn .lb-en { font-family:"Gentium Book Plus",serif; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); }

/* λόγος reference scroll — fullscreen parchment overlay. */
.scroll-overlay {
  position:fixed; inset:0;
  background:rgba(20,14,8,0.72);
  display:flex; align-items:center; justify-content:center;
  z-index:200; padding:1rem;
  animation:fadeIn .18s ease-out;
}
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
.scroll-box {
  background:linear-gradient(180deg, #efdfb4, #e6d29a);
  color:#4a2e15;
  border:2px solid #5a3a1f;
  border-radius:0.6rem;
  box-shadow:0 1.2rem 3rem rgba(0,0,0,0.6);
  max-width:520px; width:100%; max-height:86vh; overflow-y:auto;
  padding:1.4rem 1.5rem;
  font-family:"Gentium Book Plus",Georgia,serif;
}
.scroll-title {
  text-align:center;
  font-family:"Cinzel",serif;
  font-weight:700;
  font-size:1.5rem;
  letter-spacing:0.22em;
  color:#5a3a1f;
  margin-bottom:0.5rem;
}
.scroll-sub {
  text-align:center;
  font-size:0.86rem;
  color:#7a5230;
  font-style:italic;
  margin-bottom:0.8rem;
}
.scroll-section-title {
  font-weight:bold;
  font-size:0.94rem;
  margin:0.9rem 0 0.3rem;
  color:#6b4a25;
  border-bottom:1px solid rgba(90,58,31,0.3);
  padding-bottom:0.2rem;
}
.scroll-row {
  display:grid;
  grid-template-columns:46px 1fr auto;
  gap:0.3rem 0.7rem;
  align-items:center;
  padding:0.32rem 0;
  border-bottom:1px dotted rgba(90,58,31,0.18);
}
.scroll-row .r-mark { color:var(--accent-2); font-weight:700; text-align:center; }
.scroll-row .r-icon { display:flex; align-items:center; justify-content:center; width:46px; height:36px; overflow:visible; }
.scroll-row .r-icon svg { height:34px; width:auto; max-width:46px; display:block; }
.scroll-row .r-icon .logos-emoji { font-size:24px; line-height:1; }
.scroll-row .r-greek { font-size:1.12rem; color:#4a2e15; }
.scroll-row .r-type {
  font-family:"Courier New",monospace;
  font-size:0.82rem;
  color:#8b6a3a;
  text-align:right;
  white-space:nowrap;
}
.scroll-row .r-cost { color:var(--accent-2); }   /* "= cost" stands apart from the word */
.scroll-close {
  display:block;
  margin:1.2rem auto 0;
  padding:0.5rem 1.6rem;
  background:#3d2818;
  color:#f4e9cf;
  border:2px solid #d9b04a;
  border-radius:0.45rem;
  cursor:pointer;
  font-family:"Cinzel",serif;
  font-size:1rem;
  letter-spacing:1px;
}
.scroll-close:hover { background:#4d3320; }
.pause-box { max-width:380px; text-align:center; }
/* command-word buttons (pause / resume) carry a real .lbl-greek chip so the
   word looks + lights exactly like a typable map label. */
.cmd-btn .lbl-greek { font-size:13px; padding:0 6px; }
.hud-res .lbl-greek { font-size:11px; padding:0 4px; animation:none; }
.pause-resume { display:inline-flex; align-items:center; justify-content:center; gap:0.55rem; }
.pause-resume .resume-en { font-size:0.72rem; letter-spacing:1px; opacity:0.85; }
.pause-hint { margin-top:0.9rem; font-size:0.82rem; color:#7a5230; font-style:italic; }
.pause-hint kbd { font-family:"Courier New",monospace; font-style:normal; background:rgba(90,58,31,0.14); border:1px solid rgba(90,58,31,0.35); border-radius:4px; padding:0 5px; }
#game-root[data-theme="dark"] .pause-hint { color:#c6a86a; }
/* pause-menu actions (reset, with two-step confirm) */
.pause-actions { margin-top:1.1rem; display:flex; justify-content:center; }
.pause-mini { font:inherit; font-size:0.82rem; padding:0.35rem 0.95rem; margin:0 0.2rem; border-radius:0.4rem; border:1px solid rgba(90,58,31,0.4); background:rgba(255,250,238,0.7); color:#5a3a1f; cursor:pointer; }
.pause-mini:hover { background:#fff8ea; }
.pause-mini.danger { border-color:#b04a32; color:#b04a32; }
.pause-mini.danger:hover { background:#b04a32; color:#f7f1e1; }
.reset-confirm { text-align:center; }
.reset-q { font-size:0.85rem; color:#7a5230; margin-bottom:0.55rem; }
.reset-btns { display:flex; justify-content:center; gap:0.45rem; }
#game-root[data-theme="dark"] .pause-mini { background:rgba(60,48,34,0.6); color:#efe6d2; border-color:rgba(217,176,74,0.4); }
#game-root[data-theme="dark"] .reset-q { color:#c6a86a; }
/* alpha build tag + autosave indicator (subtle, bottom-left) */
.build-tag { position:fixed; left:11px; bottom:8px; z-index:60; pointer-events:none; font-family:"Gentium Book Plus",serif; font-size:11px; letter-spacing:0.06em; color:var(--ink-soft); opacity:0.72; }
.build-tag .saved-tick { color:var(--accent); opacity:0; transition:opacity .25s ease-out; }
.build-tag .saved-tick.show { opacity:1; }

/* Greek-only input: a transparent <input> captures Latin keystrokes; the

.greek-field { position:relative; flex:1; display:flex; align-items:center; min-height:30px; overflow:hidden; cursor:text; }

.latin-input::selection      { color:transparent; background:rgba(150,120,70,0.28); }

/* =====================================================================
 * DARK MODE — "lamplit evening". Warm dark walnut ground, cream ink,
 * glowing gold accents, buildings reading as candlelit. Toggle (☾/☀) lives
 * with the zoom controls; choice persists in localStorage('polis-theme').
 * Art outlines (--ink-line) stay dark so buildings keep crisp edges; only
 * TEXT (--ink) flips to cream, and the hardcoded light surfaces below get
 * dark overrides so labels/panels don't swallow their own text.

  --wall:#d6c197; --wall-2:#c2aa80; --roof:#b85d38; --roof-2:#8a4226;
  --wood:#7c5330; --sky:#3f5c63;
  --stone:#9c9277; --stone-2:#857c63;
  --marble:#d6cbb1; --marble-2:#c4b799;
  --soil:#7a5c3a; --soil-2:#6e5232; --wheat:#caa03c;
  --foliage:#5c7a40; --foliage-2:#7d9a5b; --olive-leaf:#828d66; --olive-fruit:#2e281c;
  --vine-leaf:#5f7a42; --grape:#7d4b86; --cloth:#b85f43; --berry:#c25a46;

<!--
  ΚΩΜΗ / ΠΟΛΙΣ — single-file React app.
  This is Session A of the iso-parchment reskin (see greek-polis-design.md).
  Visuals adopted from Claude Design's civ-builder handoff; gameplay logic
  ports over from greek-komi.html in Session B.
-->

<script>
/* =========================================================================
 * Plain-JS layer: transliteration, skeleton matching, vocabulary definitions.
 * Lives outside React so the greek-tests.html harness can read it via the
 * window.__KOMI_TEST__ hook posted from App's useEffect.
 * ========================================================================= */

function convert(input) {
  if (!input) return '';
  const s = String(input).toLowerCase().replace(/\s+/g, '');
  if (!s) return '';
  const singles = {
    a:'α', b:'β', g:'γ', d:'δ', e:'ε', z:'ζ', j:'η', i:'ι', k:'κ', l:'λ',
    m:'μ', n:'ν', x:'ξ', o:'ο', p:'π', r:'ρ', s:'σ', t:'τ', u:'υ', f:'φ',
    c:'χ', w:'ω', y:'ψ'
  };
  const digraphs = { th:'θ', ph:'φ', kh:'χ', ps:'ψ' };

  // Combining diacritics (typed Latin → mark). skeleton() strips these before
  // matching, so accents/breathing only ever affect the rendered preview.
  const ACUTE=0x0301, GRAVE=0x0300, CIRC=0x0342, ROUGH=0x0314, SMOOTH=0x0313, SUB=0x0345, DIAER=0x0308;
  const accentKey = { '/':ACUTE, '`':GRAVE, '\\':GRAVE, '~':CIRC, '=':CIRC, '|':SUB, ':':DIAER };
  const ACC = [ACUTE, GRAVE, CIRC], BR = [ROUGH, SMOOTH];
  // apostrophe cycles the accent (Lexilogos): ' = acute, '' = grave, ''' = none
  const nextAccent = (cur) => cur === ACUTE ? GRAVE : cur === GRAVE ? null : ACUTE;
  const cycleAccent = (marks) => {
    const base = marks.filter((c) => ACC.indexOf(c) < 0);
    const nx = nextAccent(marks.find((c) => ACC.indexOf(c) >= 0));
    return nx == null ? base : base.concat(nx);
  };
  const VOWELS = 'αεηιουω';
  const isV = (g) => VOWELS.indexOf(g) >= 0;
  // canonical mark order so NFC precomposes (ἕ, ὕ, ῖ): breathing/diaeresis, accent, iota-subscript
  const ord = (c) => (c===ROUGH||c===SMOOTH||c===DIAER) ? 1 : (c===ACUTE||c===GRAVE||c===CIRC) ? 2 : 3;
  const addMark = (marks, code) => {
    let m = ACC.indexOf(code) >= 0 ? marks.filter((c) => ACC.indexOf(c) < 0)
          : BR.indexOf(code)  >= 0 ? marks.filter((c) => BR.indexOf(c)  < 0) : marks.slice();
    if (m.indexOf(code) < 0) m.push(code);
    return m;
  };
  const compose = (base, marks) =>
    (base + marks.slice().sort((a, b) => ord(a) - ord(b)).map((c) => String.fromCharCode(c)).join('')).normalize('NFC');

  const toks = [];            // { g, vowel, marks:[] }
  let pendingAccent = null;   // accent typed with no preceding vowel → applies to the next vowel
  let wordBreathing = null;   // leading h/hh breathing, awaiting its vowel
  let firstVowelSeen = false;
  let i = 0;

  // leading breathing: word-initial h (rough) / hh (smooth) before a vowel
  const lead = /^h+/.exec(s);
  if (lead && isV(singles[s[lead[0].length]] || '')) {
    wordBreathing = lead[0].length >= 2 ? SMOOTH : ROUGH;
    i = lead[0].length;
  }

  while (i < s.length) {
    const one = s[i], two = s.slice(i, i+2);
    // apostrophe → cycle the preceding vowel's accent (acute → grave → none), else queue acute
    if (one === "'" || one === '’') {
      const prev = toks[toks.length - 1];
      if (prev && prev.vowel) prev.marks = cycleAccent(prev.marks);
      else pendingAccent = nextAccent(pendingAccent);
      i++; continue;
    }
    // diacritic modifier → preceding vowel if eligible, else queue for the next vowel
    if (accentKey[one] !== undefined) {
      const prev = toks[toks.length - 1];
      if (prev && prev.vowel) prev.marks = addMark(prev.marks, accentKey[one]);
      else pendingAccent = accentKey[one];
      i++; continue;
    }
    // suffix breathing: vowel+h (ἁ) or word-initial ρ+h (ῥ)
    if (one === 'h') {
      const prev = toks[toks.length - 1];
      if (prev && (prev.vowel || prev.g === 'ρ')) prev.marks = addMark(prev.marks, ROUGH);

    }

    let g, adv = 1;

      if (wordBreathing != null) {

        const diph = !firstVowelSeen && 'αεηου'.indexOf(g) >= 0 && (nextG === 'ι' || nextG === 'υ');
        if (firstVowelSeen || !diph) {        // single vowel, or the 2nd vowel of an initial diphthong

function skeleton(s) {
  return (s || '')
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')   // strip combining diacritics
    .toLowerCase()
    .replace(/η/g, 'ε')
    .replace(/ω/g, 'ο')
    .replace(/ς/g, 'σ');
}

/* Village-tier vocabulary. Town/City tiers add to this in later sessions. */
const VOCAB_DEFS = {
  // --- resources (typing the resource name harvests from its source) ---
  karpos: { greek:'καρπός', en:'fruit',  kind:'resource', source:'bush',  glyph:'berry', amount:3 },
  lithos: { greek:'λίθος',  en:'stone',  kind:'resource', source:'rock',  glyph:'stone', amount:3 },
  xylon:  { greek:'ξύλον',  en:'wood',   kind:'resource', source:'tree',  glyph:'wood',  amount:3 },
  hydor:  { greek:'ὕδωρ',   en:'water',  kind:'resource', source:'water', glyph:'water', amount:2 },
  sitos:  { greek:'σῖτος',  en:'grain',  kind:'resource', source:'farm',  glyph:'wheat', amount:9 },
  oinos:  { greek:'οἶνος',  en:'wine',   kind:'resource', source:'vineyard', glyph:'wine', amount:4, tier:'town' },
  // --- village buildings ---  (acceptZones = which tile roles it can occupy, in order)
  oikia:    { greek:'οἰκία',    en:'house',      kind:'building', cost:{ xylon:2, lithos:1 }, acceptZones:['housing'], gives:{ demos:2 } },
  agros:    { greek:'ἀγρός',    en:'field',      kind:'building', cost:{ xylon:2, lithos:2 }, acceptZones:['farm'], field:true },
  phrear:   { greek:'φρέαρ',    en:'well',       kind:'building', cost:{ xylon:1, lithos:3 }, acceptZones:['civic'] },
  apotheke: { greek:'ἀποθήκη',  en:'storehouse', kind:'building', cost:{ xylon:3, lithos:1 }, acceptZones:['service','housing'], capBonus:10 },
  hodos:    { greek:'ὁδός',     en:'road',       kind:'road',     cost:{ lithos:1 }, acceptZones:['road'] },
  // --- TOWN-tier buildings (unlocked after founding the κώμη) ---
  sunoikia: { greek:'συνοικία', en:'townhouse',  kind:'building', tier:'town', cost:{ xylon:3, lithos:3 }, acceptZones:['housing'], gives:{ demos:4 } },
  ampelon:  { greek:'ἀμπελών',  en:'vineyard',   kind:'building', tier:'town', cost:{ xylon:2, lithos:2 }, acceptZones:['vineyard'], field:true },
  naos:     { greek:'ναός',     en:'temple',     kind:'building', tier:'town', cost:{ lithos:5, oinos:2 }, acceptZones:['civic'] },
  agora:    { greek:'ἀγορά',    en:'marketplace',kind:'building', tier:'town', cost:{ lithos:4, xylon:2 }, acceptZones:['civic'] },
  krene:    { greek:'κρήνη',    en:'fountain',   kind:'building', tier:'town', cost:{ lithos:4 }, acceptZones:['civic'] },
  stoa:     { greek:'στοά',     en:'colonnade',  kind:'building', tier:'town', cost:{ lithos:3, xylon:3 }, acceptZones:['civic'] },
  // --- scenery / reference words (typing them just shows the name) ---
  dendron: { greek:'δένδρον', en:'tree', kind:'reference' },
  petra:   { greek:'πέτρα',   en:'rock', kind:'reference' },
  potamos: { greek:'ποταμός', en:'river', kind:'reference' },
  // --- command words: open the word-list, pause, resume (typed like any word) ---
  logos: { greek:'λόγος', en:'the word-list', kind:'reference', special:'openLogos' },
  pausis:    { greek:'παῦσις',   en:'pause',  kind:'command', special:'openMenu'  },
  sunekheia: { greek:'συνέχεια', en:'resume', kind:'command', special:'closeMenu' },
  boetheia:  { greek:'βοήθεια', en:'help',   kind:'command', special:'openHelp'  },
  // --- γραφεύς: assign a passive scribe to a material — "γραφεύς λίθος" / "γραφεύς ξύλον" ---
  grapheus: { greek:'γραφεύς', en:'scribe', kind:'scribe' },
  // --- goals: founding words that GROW the map (κώμη village→town, πόλις town→city) ---
  kome:  { greek:'κώμη',  en:'village', kind:'goal' },
  polis: { greek:'πόλις', en:'city',    kind:'goal' }
};

/* Skeleton → id lookup. Collisions would mean two words share a lenient
 * shape; tests/harness flag those. */
const SKEL = {};
for (const id in VOCAB_DEFS) {
  const sk = skeleton(VOCAB_DEFS[id].greek);
  if (!SKEL[sk]) SKEL[sk] = id;
}

/* ---- Greek cardinal numbers (Koine) ----------------------------------------
 * Cardinals 1/3/4 decline by gender and the counted noun goes plural, so cost
 * phrases must agree: 2 ξύλον → δύο ξύλα, 1 λίθος → εἷς λίθος, 3 λίθος → τρεῖς
 * λίθοι. Drives both the λόγος cost display AND number-phrase harvest typing. */
const NOUN_FORMS = {
  lithos: { g: 'm', sing: 'λίθος', pl: 'λίθοι' },
  xylon:  { g: 'n', sing: 'ξύλον', pl: 'ξύλα'  },
};
const NUMWORDS = {
  1: { m: 'εἷς',     f: 'μία',     n: 'ἕν'      },
  2: { m: 'δύο',     f: 'δύο',     n: 'δύο'     },
  3: { m: 'τρεῖς',   f: 'τρεῖς',   n: 'τρία'    },
  4: { m: 'τέσσαρες', f: 'τέσσαρες', n: 'τέσσαρα' },
  5: { m: 'πέντε',   f: 'πέντε',   n: 'πέντε'   },
};
function numberWord(n, g) {
  return (NUMWORDS[n] && (NUMWORDS[n][g] || NUMWORDS[n].m)) || String(n);
}
function numberPhrase(count, res) {
  const nf = NOUN_FORMS[res];
  if (!nf) return count + ' ' + ((VOCAB_DEFS[res] || {}).greek || res);
  return numberWord(count, nf.g) + ' ' + (count === 1 ? nf.sing : nf.pl);
}
// reverse lookups (by skeleton) for parsing typed "[number] [noun]" phrases
const NUM_VALUE = {};
Object.entries(NUMWORDS).forEach(([val, forms]) =>
  Object.values(forms).forEach((w) => { NUM_VALUE[skeleton(w)] = +val; }));
const MATERIAL_SK = {};
Object.entries(NOUN_FORMS).forEach(([res, nf]) => {
  MATERIAL_SK[skeleton(nf.sing)] = res;
  MATERIAL_SK[skeleton(nf.pl)]   = res;
});
// "treis lithoi" → { count:3, res:'lithos' }, or null. (Materials only: λίθος/ξύλον.)
function parseNumberPhrase(input) {
  const sk = skeleton(convert(input));
  for (const numSk in NUM_VALUE) {
    if (numSk && sk.startsWith(numSk) && sk.length > numSk.length) {
      const rest = sk.slice(numSk.length);
      if (MATERIAL_SK[rest]) return { count: NUM_VALUE[numSk], res: MATERIAL_SK[rest] };
    }
  }
  return null;
}

// "γραφεύς λίθος" → { res:'lithos' }. Scribes work building materials only.
const SCRIBE_SK = skeleton('γραφεύς');
const SCRIBE_RES_SK = {};
['lithos', 'xylon'].forEach((res) => {
  const nf = NOUN_FORMS[res];
  if (nf) { SCRIBE_RES_SK[skeleton(nf.sing)] = res; SCRIBE_RES_SK[skeleton(nf.pl)] = res; }
  SCRIBE_RES_SK[skeleton(VOCAB_DEFS[res].greek)] = res;
});
function parseScribeCommand(input) {
  const sk = skeleton(convert(input));
  if (!sk.startsWith(SCRIBE_SK) || sk.length <= SCRIBE_SK.length) return null;
  const rest = sk.slice(SCRIBE_SK.length);
  return SCRIBE_RES_SK[rest] ? { res: SCRIBE_RES_SK[rest] } : null;
}

window.__POLIS = { convert, skeleton, VOCAB_DEFS, SKEL, numberPhrase, parseNumberPhrase, parseScribeCommand };
</script>
